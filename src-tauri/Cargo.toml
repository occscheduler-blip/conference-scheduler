[package]
name = "conference-scheduler-desktop"
version = "0.1.0"
description = "Hamilton Conference Scheduler"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "conference-scheduler-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
