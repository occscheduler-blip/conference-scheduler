name: Keepalive

on:
  schedule:
    # Weekly, Sunday 14:23 UTC. Off-the-hour to reduce GitHub scheduler delay.
    # Render is kept warm by UptimeRobot; this only prevents Supabase
    # from pausing the project after ~7 days of inactivity.
    - cron: "23 14 * * 0"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          curl -fsS --retry 3 --retry-delay 5 --max-time 30 \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL%/}/rest/v1/symposiums?select=id&limit=1"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
