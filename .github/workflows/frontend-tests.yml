name: Frontend Tests

on:
  pull_request:
    paths:
      - "app/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "next.config.ts"
      - "vitest.config.ts"
      - "vitest.setup.ts"
      - ".github/workflows/frontend-tests.yml"
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "next.config.ts"
      - "vitest.config.ts"
      - "vitest.setup.ts"
      - ".github/workflows/frontend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test
